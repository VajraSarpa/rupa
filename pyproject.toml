[project]
name = "rupa"
version = "0.1.1"
description = "Render Markdown + frontmatter from stdin into styled HTML or PDF."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pygments>=2.17",
    "weasyprint>=70",
    "pdfplumber>=0.11",
]

[project.scripts]
rupa = "rupa.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rupa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
