[project]
name = "rupa"
version = "0.1.6"
description = "Render Markdown + frontmatter into themed HTML, PDF or DOCX, with Vega-Lite charts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pygments>=2.17",
    "weasyprint>=70",
    "pdfplumber>=0.11",
    "pypdfium2>=4",  # rasterises SVG for DOCX (already a pdfplumber dependency)
    "linkify-it-py>=2.0",
]

[project.optional-dependencies]
# Vega-Lite charts: a JavaScript engine in a wheel (about 84 MB), so opt-in.
charts = ["vl-convert-python>=1.9"]

[project.scripts]
rupa = "rupa.cli:main"

[dependency-groups]
dev = ["pytest>=8", "vl-convert-python>=1.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rupa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
